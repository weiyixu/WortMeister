[package]
name = "wortmeister_core"
version = "0.0.9"
edition = "2021"
authors = ["Deutsch Coach Pro"]
description = "Shared, UI-agnostic core logic for WortMeister (used by desktop and iOS)"

[lib]
name = "wortmeister_core"
# cdylib + staticlib so the same crate can be linked into an iOS app
# (static) and used from other tooling (dynamic). rlib keeps it usable as
# a normal Rust dependency for the desktop build if desired.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
unicode-normalization = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
