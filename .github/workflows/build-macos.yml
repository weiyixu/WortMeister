name: Build macOS

# Builds a universal macOS binary + .app bundle using GitHub's macOS runners.
# You do NOT need a Mac of your own: push to GitHub (or trigger manually) and
# download the artifact from the Actions run.
#
# NOTE on old-OS support: macos-latest is an Apple Silicon runner with a recent
# SDK. MACOSX_DEPLOYMENT_TARGET below sets the minimum macOS the binary declares.
# Only the x86_64 slice can run on macOS 10.x (all 10.x Macs are Intel); the
# arm64 slice always needs macOS 11+. Targeting a very old OS from a newer SDK
# is best-effort - if you must guarantee 10.x, test on real 10.x hardware.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (with Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build universal binary + .app bundle
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh universal

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeutschWorttrainer-macos
          path: dist/macos/
